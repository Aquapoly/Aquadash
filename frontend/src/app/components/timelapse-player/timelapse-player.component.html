<dialog
  #videoDialog
  class="modal"
  aria-labelledby="timelapse-player-title"
  (close)="onDialogClose()"
  (click)="onDialogClick($event)"
>
  <div class="modal-box w-11/12 max-w-5xl overflow-hidden p-0" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between gap-4 p-5 pb-3">
      <div class="min-w-0">
        <h2 id="timelapse-player-title" class="truncate text-lg font-bold sm:text-xl">
          {{ selectedTimelapse?.name || 'Lecture du timelapse' }}
        </h2>
        @if (selectedTimelapse) {
          <p class="mt-1 text-sm text-base-content/60">
            {{ selectedTimelapse.start_date | date:'dd/MM/yyyy HH:mm' }}
          </p>
        }
      </div>
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-circle shrink-0"
        aria-label="Fermer le lecteur vidéo"
        title="Fermer"
        (click)="close()"
      >
        <svg class="h-5 w-5" aria-hidden="true">
          <use href="/assets/svg/close.svg#icon" />
        </svg>
      </button>
    </div>
    @if (selectedTimelapse; as timelapse) {
      @if (videoError) {
        <div class="grid aspect-video place-items-center bg-base-200 p-6 text-center">
            <p class="font-medium">La vidéo n’a pas pu être lue.</p>
        </div>
      } @else {
        <video
          class="block max-h-[75vh] w-full bg-black"
          [src]="videoUrl(timelapse)"
          controls
          autoplay
          playsinline
          [attr.aria-label]="'Lecture de ' + timelapse.name"
          (error)="onVideoError()"
        >
          Votre navigateur ne prend pas en charge la lecture vidéo.
        </video>
      }
    }
  </div>
</dialog>
